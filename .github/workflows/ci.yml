name: CI

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - "feat/**"
      - "feature/**"
      - "fix/**"
      - "test/**"
      - "chore/**"
      - "ci/**"
      - "refactor/**"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
